<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found (404) | SocialTush</title>
<meta name="description" content="The page you were looking for could not be found. Return to the SocialTush homepage or explore our digital marketing services.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/images/400_640c788b15514-aspect-ratio-1-1-width-48-format-png.png">
<style>
  :root { --brand: #2eb872; --ink: #1f2937; --muted: #6b7280; --bg: #f7f8fa; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; padding: 24px 16px; text-align: center; }
  main { max-width: 560px; }
  img { width: 96px; height: auto; }
  h1 { font-size: 2rem; margin: 16px 0 8px; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
  .code { font-size: 4.5rem; font-weight: 700; color: var(--brand); margin: 0; line-height: 1; }
  nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  a { display: inline-block; padding: 10px 18px; border-radius: 6px; text-decoration: none; border: 1px solid var(--brand); color: var(--brand); font-weight: 600; }
  a.primary { background: var(--brand); color: #fff; }
  a:hover, a:focus-visible { opacity: .85; }
</style>
</head>
<body>
<main>
  <a href="/" style="border:0;padding:0"><img src="/assets/images/400_640c7883f383c.png" alt="SocialTush logo"></a>
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p>Sorry, the page you're looking for doesn't exist or has moved. Try one of these instead:</p>
  <nav aria-label="Helpful links">
    <a class="primary" href="/">Home</a>
    <a href="/services">Services</a>
    <a href="/pricing">Pricing</a>
    <a href="/blog">Blog</a>
    <a href="/contact-us">Contact us</a>
  </nav>
</main>
</body>
</html>
